<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dome entry counter</title>
<style>
  :root {
    --bg: #f3f4f6; --card: #ffffff; --ink: #111827; --muted: #5b6472; --line: #e2e5ea;
    --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --accent: #1d4ed8; --danger-bg: #b91c1c; --danger-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --card: #1a1f29; --ink: #f1f3f6; --muted: #9aa3b2; --line: #2b3240;
      --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --accent: #93c5fd; --danger-bg: #dc2626; --danger-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 14px 16px; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.1rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 4px; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 32px; display: grid; gap: 14px;
         grid-template-columns: minmax(0, 1fr); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  .pill { font-size: .8rem; font-weight: 600; padding: 4px 10px; border-radius: 999px;
          border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.live { color: var(--ok); border-color: var(--ok); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .label, .muted { color: var(--muted); font-size: .9rem; margin: 0; }
  .big { font-size: 4.2rem; font-weight: 700; line-height: 1.05; margin: 2px 0 0; font-variant-numeric: tabular-nums; }
  .big .cap { font-size: 1.6rem; font-weight: 500; color: var(--muted); }
  .left { font-size: 1.25rem; font-weight: 600; margin: 2px 0 12px; }
  .s-ok { color: var(--ok); } .s-warn { color: var(--warn); } .s-bad { color: var(--bad); }
  .gates { display: grid; gap: 8px; }
  .gate { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px;
          padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-variant-numeric: tabular-nums; }
  .gate .name { font-size: 1.15rem; font-weight: 700; }
  .gate .num { text-align: right; }
  .gate .num b { font-size: 1.5rem; }
  .gate small { display: block; color: var(--muted); font-size: .78rem; font-weight: 400; }
  .warn { color: var(--bad); font-weight: 600; margin: 8px 0; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  button { font: inherit; font-weight: 600; min-height: 52px; padding: 0 18px; border-radius: 12px;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; flex: 1 1 160px; }
  button.danger { background: var(--danger-bg); color: var(--danger-ink); border-color: var(--danger-bg); }
  button.mini { min-height: 46px; padding: 0 14px; border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .total { font-size: 1.7rem; font-weight: 700; margin: 0 0 10px; font-variant-numeric: tabular-nums; }
  .total small { font-size: .95rem; font-weight: 500; color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 7px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-size: .8rem; font-weight: 600; border-top: 0; }
  th:first-child, td:first-child, th:nth-child(2), td:nth-child(2) { text-align: left; }
  tr.now td { font-weight: 700; }
  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 18px; width: min(92vw, 380px);
           background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .55); }
  dialog label { display: block; font-weight: 600; margin-top: 12px; }
  dialog input { display: block; width: 100%; margin-top: 6px; min-height: 52px; font: inherit; font-size: 1.4rem;
                 letter-spacing: .2em; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line);
                 background: var(--bg); color: var(--ink); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 12px 18px; border-radius: 12px; font-weight: 600; max-width: 92vw; }
</style>
</head>
<body>
<header>
  <h1>Dome entry counter</h1>
  <span id="link" class="pill" role="status">connecting…</span>
</header>
<main>
  <section class="card" aria-labelledby="lblShow">
    <p class="label" id="lblShow">Inside now (all gates)</p>
    <p class="big"><span id="inside">–</span><span class="cap"> / <span id="cap">–</span></span></p>
    <p class="left" id="left">&nbsp;</p>
    <div class="gates" id="gates"></div>
    <p class="warn" id="warn" hidden></p>
    <div class="actions">
      <button id="btnReset" class="danger" disabled>Reset all gates</button>
      <button id="btnUndo" hidden>Undo last reset</button>
    </div>
  </section>

  <section class="card" aria-labelledby="lblToday">
    <h2 id="lblToday">Today</h2>
    <p class="total"><span id="today">–</span> <small>people so far</small></p>
    <div class="scroll"><table id="shows"></table></div>
  </section>

  <section class="card" aria-labelledby="lblEvent">
    <h2 id="lblEvent">Whole event</h2>
    <p class="total"><span id="event">–</span> <small>people counted</small></p>
    <div class="scroll"><table id="days"></table></div>
  </section>
</main>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form id="form">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText" class="muted"></p>
    <label for="pin">PIN</label>
    <input id="pin" inputmode="numeric" autocomplete="off" required>
    <p class="warn" id="dlgMsg" hidden></p>
    <div class="actions">
      <button type="button" id="btnCancel">Cancel</button>
      <button id="btnGo" class="danger"></button>
    </div>
  </form>
</dialog>
<div id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
// The counter laptop publishes its numbers to a public MQTT broker and listens there for commands.
// BROKER and TOPIC must match WEB_HOST / WEB_PORT / WEB_TOPIC in counter.py. (?topic=... is for testing.)
const BROKER = "wss://broker.emqx.io:8084/mqtt";
const TOPIC = new URLSearchParams(location.search).get("topic") || "cnt-1223d72e6c6d8499";

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString("en-IN");
const hm = t => (t || "").slice(0, 5);
let st = null;          // last status from the laptop
let fresh = 0;          // when a live (not stored) status last arrived
let pending = null;     // command waiting for the laptop's answer
let mode = "reset";     // "reset" or "undo"
let target = null;      // gate name for a one-gate reset, null = all gates
let built = "";         // which gates the gate rows were built for
const rows = {};        // gate name -> its row's elements

function cell(tag, text) { const e = document.createElement(tag); e.textContent = text; return e; }
function row(cells, cls) {
  const tr = document.createElement("tr");
  if (cls) tr.className = cls;
  cells.forEach(c => tr.appendChild(cell("td", c)));
  return tr;
}
function head(cells) {
  const tr = document.createElement("tr");
  cells.forEach(c => tr.appendChild(cell("th", c)));
  return tr;
}
const isLive = () => Date.now() - fresh < 7000;
const net = g => st.gates[g][0] - st.gates[g][1];
const since = g => hm(st.since ? st.since[g] : st.show_start);

// The gate rows are built once and then only their text changes, so a tap on a Reset button is never
// lost to a redraw (new numbers arrive every 2 seconds).
function buildGates(names) {
  const box = $("gates");
  box.replaceChildren();
  names.forEach(g => {
    const d = document.createElement("div");
    d.className = "gate";
    const name = cell("span", g);
    name.className = "name";
    const cam = cell("small", "");
    const meta = cell("small", "");
    name.append(cam, meta);
    const num = document.createElement("span");
    num.className = "num";
    const n = cell("b", "");
    const io = cell("small", "");
    num.append(n, io);
    const btn = cell("button", "Reset");
    btn.className = "mini";
    btn.type = "button";
    btn.setAttribute("aria-label", "Reset " + g);
    btn.onclick = () => ask("reset", g);
    d.append(name, num, btn);
    box.appendChild(d);
    rows[g] = { cam, meta, n, io, btn };
  });
}

function render() {
  if (!st) return;
  const names = Object.keys(st.gates);
  const inside = names.reduce((a, g) => a + net(g), 0);
  const left = st.capacity - inside;
  const cls = left <= 0 ? "s-bad" : left <= st.capacity / 10 ? "s-warn" : "s-ok";
  $("inside").textContent = fmt(inside);
  $("inside").className = cls;
  $("cap").textContent = fmt(st.capacity);
  $("left").textContent = left <= 0 ? "HOUSE FULL" : fmt(left) + " places left";
  $("left").className = "left " + cls;

  if (built !== names.join("|")) { buildGates(names); built = names.join("|"); }
  names.forEach(g => {
    const [i, o] = st.gates[g];
    rows[g].cam.textContent = st.cams && st.cams[g] ? "camera " + st.cams[g] : "";
    rows[g].meta.textContent = "counting since " + since(g);
    rows[g].n.textContent = fmt(i - o);
    rows[g].io.textContent = "in " + fmt(i) + ", out " + fmt(o);
  });
  $("btnReset").textContent = names.length === 2 ? "Reset both gates" : "Reset all gates";
  $("warn").hidden = !st.no_video.length;
  $("warn").textContent = st.no_video.length ? "NO VIDEO at " + st.no_video.join(", ") + ": not counting there" : "";
  const log = st.log || [];
  $("btnUndo").hidden = !log.length;

  const shows = $("shows");
  shows.replaceChildren(head(["Gate", "Time", "In", "Out", "People"]));
  names.forEach(g => {
    const [i, o] = st.gates[g];
    shows.appendChild(row([g, since(g) + " – now", fmt(i), fmt(o), fmt(i - o)], "now"));
  });
  log.slice().reverse().forEach(s => {
    shows.appendChild(row([s.gate, hm(s.start) + " – " + hm(s.end), fmt(s.in), fmt(s.out), fmt(s.in - s.out)]));
  });

  const days = $("days");
  days.replaceChildren(head(["Day", "Date", "People"]));
  let event = 0, todayN = 0;
  st.days.forEach(([d, n], k) => {
    const isToday = d === st.date;
    if (n != null) event += n;
    if (isToday) todayN = n;
    const when = new Date(d + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const txt = n != null ? fmt(n) + (isToday ? " so far" : "") : d < st.date ? "not counted" : "–";
    days.appendChild(row(["Day " + (k + 1), when, txt], isToday ? "now" : ""));
  });
  $("today").textContent = fmt(todayN);
  $("event").textContent = fmt(event);
  const dayNo = st.days.findIndex(([d]) => d === st.date) + 1;
  $("lblToday").textContent = "Today" + (dayNo ? " (day " + dayNo + " of " + st.days.length + ")" : "");
}

function tick() {
  const live = isLive();
  const link = $("link");
  link.className = "pill " + (live ? "live" : st ? "off" : "");
  link.textContent = live ? "LIVE " + st.at : st ? "OFFLINE, last seen " + st.at : "connecting…";
  $("btnReset").disabled = !live;
  $("btnUndo").disabled = !live;
  Object.values(rows).forEach(r => { r.btn.disabled = !live; });
}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 4000);
}

async function sign(pin, text) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pin), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", key, enc.encode(text));
  return [...new Uint8Array(sig)].map(b => b.toString(16).padStart(2, "0")).join("");
}

function ask(which, gate) {
  if (!st) return;
  mode = which;
  target = gate || null;
  const names = Object.keys(st.gates);
  if (which === "undo") {
    $("dlgTitle").textContent = "Undo the last reset?";
    $("dlgText").textContent = "Whatever the last reset closed is reopened and keeps counting. Use this after a reset pressed by mistake.";
  } else if (target) {
    const others = names.filter(g => g !== target);
    $("dlgTitle").textContent = "Reset " + target + " for its next show?";
    $("dlgText").textContent = target + "'s count (" + fmt(net(target)) + ") is saved in today's list, then " + target +
      " starts again from 0." + (others.length ? " " + others.join(" and ") + " is not touched." : "");
  } else {
    $("dlgTitle").textContent = "Reset " + (names.length === 2 ? "both" : "all") + " gates for the next show?";
    $("dlgText").textContent = "Every gate's count (" + names.map(g => g + ": " + fmt(net(g))).join(", ") +
      ") is saved in today's list, then they all start again from 0.";
  }
  $("btnGo").textContent = which === "undo" ? "Undo" : target ? "Reset " + target : "Reset all";
  $("dlgMsg").hidden = true;
  $("btnGo").disabled = false;
  try { $("pin").value = localStorage.getItem("pin") || ""; } catch (e) { /* private window: no saved PIN */ }
  $("dlg").showModal();
}

function fail(text) {
  pending = null;
  $("dlgMsg").textContent = text;
  $("dlgMsg").hidden = false;
  $("btnGo").disabled = false;
}

$("btnReset").onclick = () => ask("reset", null);
$("btnUndo").onclick = () => ask("undo", null);
$("btnCancel").onclick = () => { pending = null; $("dlg").close(); };
$("form").onsubmit = async e => {
  e.preventDefault();
  const pin = $("pin").value.trim();
  if (!pin || !st || pending) return;
  $("btnGo").disabled = true;
  $("dlgMsg").hidden = true;
  const id = Math.random().toString(36).slice(2);
  const gate = mode === "reset" ? target : null;
  pending = { id, pin, timer: setTimeout(() => fail("No answer from the counter laptop. Is it running and online?"), 7000) };
  const msg = { cmd: mode, id, mac: await sign(pin, gate ? mode + "|" + gate + "|" + st.nonce : mode + "|" + st.nonce) };
  if (gate) msg.gate = gate;
  client.publish(TOPIC + "/cmd", JSON.stringify(msg));
};

const client = mqtt.connect(BROKER, { reconnectPeriod: 2000, connectTimeout: 8000 });
client.on("connect", () => client.subscribe([TOPIC + "/status", TOPIC + "/ack"]));
client.on("message", (topic, payload, packet) => {
  let m;
  try { m = JSON.parse(payload.toString()); } catch (e) { return; }
  if (topic.endsWith("/status")) {
    st = m;
    if (!packet.retain) fresh = Date.now();   // a stored copy only shows the last known numbers
    render();
    tick();
  } else if (pending && m.id === pending.id) {
    clearTimeout(pending.timer);
    if (m.ok) {
      try { localStorage.setItem("pin", pending.pin); } catch (e) { /* not saved */ }
      pending = null;
      $("dlg").close();
      toast(m.cmd === "undo" ? "Reset undone" : m.gate ? m.gate + " reset, counting from 0" : "All gates reset for the next show");
    } else {
      fail(m.cmd === "undo" ? "Not accepted: wrong PIN, or there is nothing to undo." : "Not accepted: wrong PIN. Try again.");
    }
  }
});
setInterval(tick, 1000);
</script>
</body>
</html>
